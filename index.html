<style>

:root {
  --gold: #C9A84C;
  --gold-light: #E8C96A;
  --tibet-red: #8B1A1A;
  --tibet-red-light: #B22222;
  --bg: #0D0A07;
  --bg-card: #1A1510;
  --bg-card-hover: #221C14;
  --text: #F5EFE0;
  --text-sub: #A89870;
  --border: rgba(201,168,76,0.15);
}

* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

body {
  font-family: 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', 'Noto Sans SC', sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  overflow-x: hidden;
}

/* Top bar — header + tabs fixed together */
.top-bar {
  position: sticky;
  top: 0;
  z-index: 100;
  background: var(--bg);
}
.header {
  text-align: center;
  padding: 32px 20px 16px;
  background: linear-gradient(180deg, #1a1208 0%, var(--bg) 100%);
}
.header-brand {
  font-family: 'Noto Serif SC', 'STSong', 'Songti SC', 'SimSun', serif;
  font-size: 22px;
  font-weight: 700;
  color: var(--gold);
  letter-spacing: 0;
  white-space: nowrap;
}
.header-sub {
  font-size: 13px;
  color: var(--text-sub);
  letter-spacing: 4px;
  margin-top: 4px;
}
.header-divider {
  width: 40px;
  height: 1px;
  background: var(--gold);
  margin: 12px auto;
  opacity: 0.4;
}
.header-restaurant {
  font-family: 'Noto Serif SC', 'STSong', 'Songti SC', 'SimSun', serif;
  font-size: 13px;
  font-weight: 600;
  color: var(--gold-light);
  letter-spacing: 3px;
}
.table-badge {
  display: inline-block;
  margin-top: 8px;
  padding: 4px 14px;
  border-radius: 12px;
  background: rgba(201,168,76,0.12);
  color: var(--gold-light);
  font-size: 12px;
  letter-spacing: 2px;
  border: 1px solid rgba(201,168,76,0.2);
}
.table-badge.hidden { display: none; }

/* Tab bar */
.tabs {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 6px;
  padding: 12px 12px;
  background: var(--bg);
}
.tab {
  flex-shrink: 0;
  padding: 8px 18px;
  border-radius: 24px;
  border: 1px solid var(--border);
  background: var(--bg-card);
  color: var(--text-sub);
  font-size: 13px;
  cursor: pointer;
  transition: all 0.25s;
  white-space: nowrap;
}
.tab.active {
  background: var(--tibet-red);
  border-color: var(--tibet-red-light);
  color: var(--gold-light);
  font-weight: 600;
}
.tab:active { transform: scale(0.95); }
.tab.highlight {
  border-color: var(--gold);
  background: rgba(201,168,76,0.08);
  color: var(--gold-light);
  font-weight: 600;
}
.tab.highlight.active {
  background: var(--tibet-red);
  color: var(--gold-light);
}
.tab-sep {
  width: 1px;
  height: 20px;
  background: var(--gold);
  opacity: 0.3;
  align-self: center;
  margin: 0 6px;
}

/* Category title */
.cat-title {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 20px 20px 12px;
}
.cat-title span {
  font-family: 'Noto Serif SC', 'STSong', 'Songti SC', 'SimSun', serif;
  font-size: 14px;
  font-weight: 600;
  color: var(--gold);
  letter-spacing: 3px;
}
.cat-line {
  flex: 1;
  height: 1px;
  background: linear-gradient(90deg, var(--gold) 0%, transparent 100%);
  opacity: 0.3;
}

/* Dish card */
.dish-card {
  margin: 6px 16px;
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 14px 16px;
  display: flex;
  align-items: center;
  gap: 14px;
  transition: background 0.2s;
}
.dish-card:active { background: var(--bg-card-hover); }

.dish-emoji {
  font-size: 32px;
  line-height: 1;
  flex-shrink: 0;
  width: 48px;
  text-align: center;
}
.dish-info { flex: 1; min-width: 0; }
.dish-name {
  font-family: 'Noto Serif SC', 'STSong', 'Songti SC', 'SimSun', serif;
  font-size: 15px;
  font-weight: 600;
  color: var(--text);
}
.dish-desc {
  font-size: 11px;
  color: var(--text-sub);
  margin-top: 3px;
  line-height: 1.4;
}
.dish-price {
  font-size: 16px;
  font-weight: 700;
  color: var(--gold);
  flex-shrink: 0;
  white-space: nowrap;
}

/* Package block */
.pk-block {
  margin: 6px 16px;
  background: var(--bg-card);
  border: 1px solid rgba(201,168,76,0.2);
  border-radius: 12px;
  overflow: hidden;
}
.pk-header {
  background: linear-gradient(90deg, rgba(139,26,26,0.4), transparent);
  padding: 10px 16px;
  border-bottom: 1px solid var(--border);
  font-family: 'Noto Serif SC', 'STSong', 'Songti SC', 'SimSun', serif;
  font-size: 14px;
  font-weight: 600;
  color: var(--gold-light);
  display: flex;
  align-items: center;
  gap: 8px;
}
.pk-note {
  font-size: 10px;
  color: var(--text-sub);
  padding: 8px 16px 4px;
  line-height: 1.5;
}
.pk-item {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 10px 16px;
  border-top: 1px solid var(--border);
  font-size: 13px;
}
.pk-item:last-child { border-bottom: none; }
.pk-size { color: var(--text); font-weight: 400; }
.pk-size span { color: var(--text-sub); font-size: 11px; margin-left: 6px; }
.pk-price { color: var(--gold); font-weight: 600; }
.pk-sides {
  display: none;
  padding: 6px 16px 10px;
  font-size: 11px;
  color: var(--text-sub);
  line-height: 1.6;
  background: rgba(0,0,0,0.2);
}
.pk-sides.show { display: block; }
.pk-toggle {
  font-size: 10px;
  color: var(--gold);
  cursor: pointer;
  padding: 0 16px 8px;
  display: block;
}

/* Section divider */
.section-note {
  text-align: center;
  font-size: 11px;
  color: var(--text-sub);
  padding: 16px;
  letter-spacing: 2px;
}

/* Drink section header */
.drink-section {
  text-align: center;
  font-size: 15px;
  font-weight: 600;
  color: var(--gold-light);
  letter-spacing: 4px;
  padding: 18px 20px 8px;
  font-family: 'Noto Serif SC', serif;
}
.drink-section::before,
.drink-section::after {
  content: '·';
  color: var(--gold);
  margin: 0 10px;
  opacity: 0.5;
}
.drink-section.cocktail {
  color: #e8a0c0;
  text-shadow: 0 0 12px rgba(232,160,192,0.15);
}

/* Qty buttons */
.dish-actions {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-shrink: 0;
  margin-left: 8px;
}
.qty-btn {
  width: 28px; height: 28px;
  border-radius: 50%;
  border: 1px solid var(--gold);
  background: transparent;
  color: var(--gold);
  font-size: 16px;
  line-height: 1;
  cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  transition: all 0.15s;
}
.qty-btn:active { background: var(--gold); color: var(--bg); }
.qty-btn.add { background: rgba(201,168,76,0.15); }
.qty-num {
  font-size: 14px;
  font-weight: 600;
  color: var(--gold-light);
  min-width: 18px; text-align: center;
}

/* Cart bar */
.cart-bar {
  position: fixed; bottom: 0; left: 0; right: 0;
  background: #1a1510; border-top: 1px solid var(--border);
  padding: 12px 16px;
  z-index: 200;
  display: flex; align-items: center; gap: 12px;
  backdrop-filter: blur(10px);
}
.cart-info { flex: 1; cursor: pointer; }
.cart-count {
  color: var(--gold-light); font-weight: 700; font-size: 15px;
}
.cart-total {
  color: var(--text-sub); font-size: 12px; margin-top: 2px;
}
.cart-submit {
  background: var(--tibet-red);
  color: var(--gold-light);
  border: none; border-radius: 24px;
  padding: 10px 24px; font-size: 14px; font-weight: 600;
  cursor: pointer; white-space: nowrap;
}
.cart-submit:active { background: var(--tibet-red-light); }
.cart-bar.hidden { display: none; }
.pb-80 { padding-bottom: 80px; }

/* Order panel */
.order-overlay {
  position: fixed; inset: 0; background: rgba(0,0,0,0.7);
  z-index: 300; display: none; align-items: flex-end; justify-content: center;
}
.order-overlay.show { display: flex; }
.order-panel {
  background: var(--bg-card); width: 100%; max-width: 500px;
  border-radius: 16px 16px 0 0; padding: 24px 20px 32px;
  animation: fadeInUp 0.3s ease;
}
.order-panel h3 { color: var(--gold); font-size: 16px; margin-bottom: 12px; text-align: center; }
.order-panel label { color: var(--text-sub); font-size: 12px; display: block; margin-bottom: 4px; }
.order-panel input {
  width: 100%; padding: 10px 14px; border-radius: 8px;
  border: 1px solid var(--border); background: var(--bg);
  color: var(--text); font-size: 14px; margin-bottom: 12px;
}
.order-items { max-height: 200px; overflow-y: auto; margin-bottom: 12px; }
.order-item {
  display: flex; justify-content: space-between; align-items: center;
  padding: 6px 0; border-bottom: 1px solid var(--border);
  font-size: 13px;
}
.order-item .oi-name { color: var(--text); flex:1; }
.order-item .oi-qty { color: var(--gold); margin: 0 8px; }
.order-item .oi-sub { color: var(--text-sub); font-size: 11px; }
.order-total-row { display: flex; justify-content: space-between; padding: 10px 0; color: var(--gold-light); font-weight: 700; font-size: 15px; }
.order-actions { display: flex; gap: 10px; }
.btn-copy { flex:1; padding: 12px; border-radius: 24px; border: none; background: var(--gold); color: var(--bg); font-size: 15px; font-weight: 700; cursor: pointer; }
.btn-close { padding: 12px 20px; border-radius: 24px; border: 1px solid var(--border); background: transparent; color: var(--text-sub); font-size: 14px; cursor: pointer; }
.btn-copy:active { opacity: 0.8; }
.toast { position: fixed; top: 50%; left: 50%; transform: translate(-50%,-50%); background: rgba(0,0,0,0.85); color: var(--gold-light); padding: 14px 28px; border-radius: 12px; font-size: 14px; z-index: 400; opacity:0; transition: opacity 0.3s; pointer-events: none; }
.toast.show { opacity:1; }

/* My orders button */
.my-orders-btn {
  position: fixed; bottom: 80px; right: 16px; z-index: 190;
  background: var(--bg-card); border: 1px solid var(--gold);
  color: var(--gold-light); border-radius: 24px;
  padding: 10px 18px; font-size: 13px; cursor: pointer;
  box-shadow: 0 4px 16px rgba(0,0,0,0.5);
  display: none; align-items: center; gap: 6px;
}
.my-orders-btn.show { display: flex; }

/* Order confirm panel */
.confirm-overlay {
  position: fixed; inset: 0; background: rgba(0,0,0,0.7);
  z-index: 300; display: none; align-items: center; justify-content: center;
}
.confirm-overlay.show { display: flex; }
.confirm-panel {
  background: var(--bg-card); width: 90%; max-width: 400px;
  border-radius: 16px; padding: 24px 20px; text-align: center;
}
.confirm-panel h3 { color: var(--green); font-size: 18px; margin-bottom: 4px; }
.confirm-panel .sub { color: var(--text-sub); font-size: 12px; margin-bottom: 12px; }
.confirm-item { display: flex; justify-content: space-between; padding: 6px 0; border-bottom: 1px solid var(--border); font-size: 13px; text-align: left; }
.confirm-total { margin-top: 10px; font-weight: 700; color: var(--gold-light); font-size: 16px; }
.confirm-close { margin-top: 16px; padding: 10px 40px; border-radius: 24px; border: 1px solid var(--border); background: transparent; color: var(--text); font-size: 14px; cursor: pointer; }
.confirm-history { margin-top: 12px; font-size: 12px; color: var(--text-sub); }
.confirm-history .old-order { padding: 8px 0; border-top: 1px dashed var(--border); text-align: left; }
.confirm-history .old-order .oo-time { color: var(--text-sub); font-size: 11px; }
.confirm-history .old-order .oo-item { font-size: 12px; color: var(--text); }
.footer {
  text-align: center;
  padding: 32px 20px 80px;
  font-size: 11px;
  color: var(--text-sub);
  line-height: 1.8;
  border-top: 1px solid var(--border);
  margin-top: 24px;

.footer .brand {
  font-family: 'Noto Serif SC', 'STSong', 'Songti SC', 'SimSun', serif;
  color: var(--gold);
  font-size: 14px;
  letter-spacing: 3px;

/* Animations */
@keyframes fadeInUp {
  from { opacity: 0; transform: translateY(12px); }
  to { opacity: 1; transform: translateY(0); }
}
.dish-card, .pk-block { animation: fadeInUp 0.4s ease both; }
.dish-card:nth-child(1), .pk-block { animation-delay: 0.05s; }

/* Scrollbar */
::-webkit-scrollbar { width: 4px; }
::-webkit-scrollbar-track { background: var(--bg); }
::-webkit-scrollbar-thumb { background: var(--gold); border-radius: 2px; opacity: 0.4; }
</style>
</head>

function cartBtnHTML(name, price) {
  const key = name + '|' + price;
  const qty = cart[key] || 0;
  const priceNum = parseInt(price) || 0;
  if (!priceNum) return '';
  if (qty === 0) {
    return `<div class="dish-actions"><button class="qty-btn add" onclick="event.stopPropagation();addToCart('${name}','${price}')">+</button></div>`;
  }
  return `<div class="dish-actions">
    <button class="qty-btn" onclick="event.stopPropagation();removeFromCart('${name}','${price}')">−</button>
    <span class="qty-num">${qty}</span>
    <button class="qty-btn add" onclick="event.stopPropagation();addToCart('${name}','${price}')">+</button>
  </div>`;
}

function renderPK(pack) {
  const btn = cartBtnHTML(pack.size, pack.price);
  return `
    <div class="pk-item">
      <div class="pk-size">${pack.size}</div>
      ${btn}
      <div class="pk-price">${pack.price}</div>
    </div>
    ${pack.sides ? `<div class="pk-sides show">${pack.sides}</div>` : ''}`;
}

function renderDish(item) {
  const btn = cartBtnHTML(item.name, item.price);
  return `
    <div class="dish-card">
      <div class="dish-emoji">${item.emoji}</div>
      <div class="dish-info">
        <div class="dish-name">${item.name}</div>
        ${item.desc ? `<div class="dish-desc">${item.desc}</div>` : ''}
      </div>
      ${item.price ? `<div class="dish-price">${item.price}</div>` : ''}
      ${btn}
    </div>`;
}

function renderSection(section) {
  if (section.type === 'title') {
    return `
    <div class="cat-title">
      <span>${section.emoji} ${section.name}</span>
    </div>
    <div class="pk-block">
      <div class="pk-header">⬛ ${section.name} · ${section.sub || ''}</div>
      ${section.desc ? `<div class="pk-note">${section.desc}</div>` : ''}
      ${section.packages.map(renderPK).join('')}
    </div>`;
  }
  if (section.type === 'section') {
    return `<div class="drink-section ${section.cls || ''}">${section.name}</div>`;
  }
  return renderDish(section);
}

function renderCat(catId) {
  const cat = MENU[catId];
  if (!cat) return '';
  return cat.map(renderSection).join('');
}

// --- Table detection ---
const urlParams = new URLSearchParams(window.location.search);
const tableNum = urlParams.get('t') || urlParams.get('table');
if (tableNum) {
  const badge = document.getElementById('table-badge');
  badge.textContent = '📍 ' + tableNum + '号桌';
  badge.classList.remove('hidden');
  document.getElementById('table-no').style.display = 'none';
  document.getElementById('table-label').textContent = '桌号：' + tableNum + '号桌';
  document.getElementById('table-no-hidden').value = tableNum + '号桌';
}

// --- Cart ---
let cart = {};
function saveCart() { try { localStorage.setItem('meiduo_cart', JSON.stringify(cart)); } catch(e) {} }
function loadCart() { try { const s = localStorage.getItem('meiduo_cart'); if (s) cart = JSON.parse(s); } catch(e) {} }
function addToCart(name, price) {
  const key = name + '|' + price;
  cart[key] = (cart[key] || 0) + 1;
  saveCart(); refreshMenu();
}
function removeFromCart(name, price) {
  const key = name + '|' + price;
  if (cart[key] > 0) cart[key]--;
  if (cart[key] === 0) delete cart[key];
  saveCart(); refreshMenu();
}
function getCartTotal() {
  let total = 0;
  for (const [key, qty] of Object.entries(cart)) {
    const price = parseInt(key.split('|')[1]) || 0;
    total += price * qty;
  }
  return total;
}
function getCartCount() {
  return Object.values(cart).reduce((a, b) => a + b, 0);
}
function refreshMenu() {
  const active = document.querySelector('.tab.active');
  if (active) {
    document.getElementById('menu-content').innerHTML = renderCat(active.dataset.cat);
  }
  renderCartBar();
}
function renderCartBar() {
  const count = getCartCount();
  const total = getCartTotal();
  const bar = document.getElementById('cart-bar');
  const countEl = document.getElementById('cart-count');
  const totalEl = document.getElementById('cart-total');
  if (count === 0) {
    bar.classList.add('hidden');
  } else {
    bar.classList.remove('hidden');
    countEl.textContent = `已选 ${count} 件`;
    totalEl.textContent = `合计 ¥${total}`;
  }
}

// --- Order ---
document.getElementById('cart-info').addEventListener('click', openOrder);
document.getElementById('cart-submit').addEventListener('click', openOrder);
document.getElementById('btn-close').addEventListener('click', closeOrder);
document.getElementById('order-overlay').addEventListener('click', function(e) {
  if (e.target === this) closeOrder();
});
document.getElementById('btn-copy').addEventListener('click', copyOrder);

function openOrder() {
  const items = document.getElementById('order-items');
  let html = '';
  for (const [key, qty] of Object.entries(cart)) {
    const [name, price] = key.split('|');
    const sub = parseInt(price) * qty;
    html += `<div class="order-item">
      <span class="oi-name">${name}</span>
      <span class="oi-qty">×${qty}</span>
      <span class="oi-sub">¥${sub}</span>
    </div>`;
  }
  items.innerHTML = html;
  document.getElementById('order-total').textContent = '¥' + getCartTotal();
  document.getElementById('order-overlay').classList.add('show');
}

function closeOrder() {
  document.getElementById('order-overlay').classList.remove('show');
}

async function copyOrder() {
  const table = document.getElementById('table-no-hidden').value || document.getElementById('table-no').value || '未填';

  // Build items array
  const items = [];
  for (const [key, qty] of Object.entries(cart)) {
    const [name, price] = key.split('|');
    items.push({ name, price, qty });
  }
  const total = getCartTotal();

  // Try to POST to backend
  try {
    const resp = await fetch('http://47.108.86.81/api/orders', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ table_no: table, items, total })
    });
    if (resp.ok) {
      // Save to localStorage for this table
      const key = 'meiduo_order_' + table;
      let saved = [];
      try { saved = JSON.parse(localStorage.getItem(key) || '[]'); } catch(e) {}
      saved.push({ time: new Date().toLocaleTimeString('zh-CN'), items, total });
      localStorage.setItem(key, JSON.stringify(saved));
      showOrderConfirm(table, items, total);
      cart = {}; saveCart(); refreshMenu(); closeOrder(); checkMyOrders();
      checkMyOrders();
      return;
    }
  } catch(e) { /* fallback to clipboard */ }

  // Fallback: copy to clipboard
  let text = `梅朵冈兰 · 谧境 | 云境膳堂\n桌号：${table}\n────────────────\n`;
  for (const [key, qty] of Object.entries(cart)) {
    const [name, price] = key.split('|');
    text += `${name}  ×${qty}  ¥${parseInt(price) * qty}\n`;
  }
  text += `────────────────\n合计：¥${total}\n${new Date().toLocaleString('zh-CN')}`;

  navigator.clipboard.writeText(text).then(() => {
    showToast('已复制，去微信粘贴发送');
  }).catch(() => {
    showToast('复制失败，请截图发送');
  });
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2000);
}

function showOrderConfirm(table, items, total) {
  const el = document.getElementById('confirm-items');
  el.innerHTML = items.map(i => `<div class=confirm-item><span>${i.name} ×${i.qty}</span><span style="color:var(--gold)">¥${(parseInt(i.price)||0)*i.qty}</span></div>`).join('');
  document.getElementById('confirm-total').textContent = '合计 ¥' + total;
  // Show history
  showConfirmHistory(table);
  document.getElementById('confirm-overlay').classList.add('show');
}
function showConfirmHistory(table) {
  const key = 'meiduo_order_' + table;
  let saved = [];
  try { saved = JSON.parse(localStorage.getItem(key) || '[]'); } catch(e) {}
  const el = document.getElementById('confirm-history');
  if (saved.length <= 1) { el.innerHTML = ''; return; }
  const prev = saved.slice(0, -1).reverse();
  el.innerHTML = '<div style="font-size:11px;color:var(--text-sub);margin-bottom:4px;">历史订单</div>' + prev.map(o => `
    <div class=old-order>
      <div class=oo-time>🕐 ${o.time}</div>
      <div class=oo-item>${o.items.map(i=>i.name+'×'+i.qty).join('，')}</div>
      <div style="color:var(--gold);font-size:11px;">¥${o.total}</div>
    </div>`).join('');
}
function closeConfirm() {
  document.getElementById('confirm-overlay').classList.remove('show');
}
function showMyOrders() {
  const table = document.getElementById('table-no-hidden').value || urlParams.get('t') + '号桌' || '未知桌';
  const key = 'meiduo_order_' + table;
  let saved = [];
  try { saved = JSON.parse(localStorage.getItem(key) || '[]'); } catch(e) {}
  if (!saved.length) { showToast('暂无订单记录'); return; }
  // Fake showOrderConfirm with last order
  showOrderConfirm(table, [], 0);
  document.getElementById('confirm-items').innerHTML = saved[saved.length-1].items.map(i => `<div class=confirm-item><span>${i.name} ×${i.qty}</span><span style="color:var(--gold)">¥${(parseInt(i.price)||0)*i.qty}</span></div>`).join('');
  document.getElementById('confirm-total').textContent = '合计 ¥' + saved[saved.length-1].total;
  showConfirmHistory(table);
}
function checkMyOrders() {
  const table = urlParams.get('t');
  if (!table) return;
  const key = 'meiduo_order_' + table + '号桌';
  let saved = [];
  try { saved = JSON.parse(localStorage.getItem(key) || '[]'); } catch(e) {}
  if (saved.length > 0) {
    document.getElementById('my-orders-btn').classList.add('show');
  }
}
checkMyOrders();

function buildTabs() {
  const tabsEl = document.getElementById('tabs');
  CATEGORIES.forEach((c, i) => {
    if (c.id === 'coffee') {
      const sep = document.createElement('span');
      sep.className = 'tab-sep';
      tabsEl.appendChild(sep);
    }
    const btn = document.createElement('button');
    let cls = 'tab';
    if (c.id === 'hotpot') cls += ' active';
    if (c.id === 'coffee' || c.id === 'cocktail' || c.id === 'tea') cls += ' highlight';
    btn.className = cls;
    btn.textContent = c.label;
    btn.dataset.cat = c.id;
    btn.addEventListener('click', () => {
      document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
      btn.classList.add('active');
      document.getElementById('menu-content').innerHTML = renderCat(c.id);
      window.scrollTo({ top: 120, behavior: 'smooth' });
    });
    tabsEl.appendChild(btn);
  });
}

loadCart();
buildTabs();
document.getElementById('menu-content').innerHTML = renderCat('hotpot');
renderCartBar();
